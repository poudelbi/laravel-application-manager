version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app-manager:latest
    container_name: laravel-app-manager-app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/master-app/storage
      - ./bootstrap/cache:/var/www/html/master-app/bootstrap/cache
      - ./database:/var/www/html/master-app/database
      - ../applications:/var/www/html/applications
      - ./logs:/var/log/supervisor
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/master-app/database/database.sqlite
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - APP_ENV=production
      - APP_DEBUG=false
      # Add your GitHub token here
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Add sudo credentials if needed
      - SUDO_PASSWORD=${SUDO_PASSWORD:-}
      - SUDO_USERNAME=${SUDO_USERNAME:-}
    depends_on:
      - redis
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: laravel-app-manager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./storage/logs:/var/log/nginx
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx-app.conf:/etc/nginx/sites-available/default
      - ./public:/var/www/html/master-app/public
    depends_on:
      - app
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: laravel-app-manager-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge